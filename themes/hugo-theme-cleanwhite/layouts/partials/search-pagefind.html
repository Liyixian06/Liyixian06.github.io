<link href="{{ "_pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
<script src="{{ "_pagefind/pagefind-ui.js" | relURL }}" type="text/javascript"></script>
<div id="search"></div>
<script>
    window.addEventListener("DOMContentLoaded", () => {
        new PagefindUI({
            element: "#search",
            showSubResults: true,
            translations: {
                placeholder: "搜索文章",
                zero_results: "没有找到 [SEARCH_TERM] 的相关内容"
            }
        });
    });
</script>
